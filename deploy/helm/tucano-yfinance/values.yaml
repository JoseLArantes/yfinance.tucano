# Default values for tucano-yfinance.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: registry.beakcloud.com/tucano-yfinance
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Rollout Strategy Configuration
# type can be:
# - deployment: Creates a standard Kubernetes deployment with RollingUpdate strategy.
# - argo-rollout: Creates an Argo Rollout custom resource (requires Argo Rollouts installed in cluster).
rollout:
  type: deployment
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%
  argo:
    steps:
      - setWeight: 20
      - pause:
          duration: 10s
      - setWeight: 50
      - pause:
          duration: 10s

# Environment variables for the container
env:
  DEFAULT_API_USERNAME: "admin"
  HOST: "0.0.0.0"
  PORT: "8009"
  DEBUG: "false"

# Secret environment variables (references to Kubernetes secrets)
secretEnv:
  DATABASE_URL:
    secretName: "yfinance-secret"
    secretKey: "DATABASE_URL"
  DEFAULT_API_TOKEN:
    secretName: "yfinance-secret"
    secretKey: "DEFAULT_API_TOKEN"

imagePullSecrets:
  - name: registry-cred

service:
  type: NodePort
  port: 8109
  targetPort: 8009
  nodePort: 30109

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: yfinance.tucano.beakcloud.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: yfinance-tls
  #    hosts:
  #      - yfinance.tucano.beakcloud.com

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
