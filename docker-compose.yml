services:
  db:
    image: postgres:15-alpine
    container_name: tucano-yfinance-db
    restart: always
    environment:
      POSTGRES_USER: tucano_yfinance
      POSTGRES_PASSWORD: tucano_yfinance
      POSTGRES_DB: tucano_yfinance
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  yfinance.tucano:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tucano-yfinance-web
    restart: always
    ports:
      - "8009:8009"
    volumes:
      - ./app:/app/app
    depends_on:
      - db
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8009 --reload

volumes:
  postgres_data:
